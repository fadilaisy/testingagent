# ROAMR (web app + API) on one AWS Lightsail instance (ap-southeast-2, Sydney).
#   browser -> Caddy (HTTPS, :443) -> app (:3001, serves web/dist and /api)
# Run from this folder on the instance: docker compose up -d --build
# Settings and secrets live in /opt/roamr/.env (see docs/DEPLOY-AWS.md).

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: /opt/roamr/.env
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_FILE: /data/roamr.db
      # Browser -> Caddy: one hop before the client IP.
      TRUST_PROXY: '1'
    volumes:
      - /opt/roamr/data:/data
    expose:
      - '3001'
    healthcheck:
      # Answers only when the database does (server/src/api/misc.js).
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    env_file: /opt/roamr/.env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/roamr/caddy:/data
